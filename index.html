async function brief(){const o=$('#b'),n=S.owner||'the owner';if(!LOG.length){o.textContent='Nothing to report yet.';return}o.textContent='Putting your briefing together…';try{o.textContent=await ai(`You are ${n}'s personal assistant giving ${n} a quick update on the messages you handled. Speak to ${n} directly. Say who wrote, what they wanted and what you told them, and flag anything that needs ${n}'s decision. Short, plain sentences, no lists, no AI phrases.`,LOG.slice(-30).map(x=>`${x.c} wrote: ${x.m}\nI replied: ${x.r}`).join('\n\n'))}catch(e){o.textContent='Could not reach the AI. The full list is above.'}}
refresh().then(save);addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>!document.hidden&&refresh());
</script></body></html>
